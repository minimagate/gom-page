<div class="post-list">
  {% for post in section.pages %}
  <a class="post-link" href="{{ post.permalink }}">
    <div class="post-row">
      <div class="post-name">{{ post.title }}</div>
      <time datetime="{{ post.date }}">{{ post.date | date(format="%B %-d, %Y") }}</time>
    </div>
  </a>
  {% endfor %}
</div>
